  objective_c: ^9.5.0
  path: ^1.9.1
  posix: ^6.5.2
  retrofit: ^4.9.2
  sodium: ^4.0.3
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

dev_dependencies:
  build_cli: ^2.2.13
  build_runner: ^2.15.1
  dart_pre_commit: ^6.1.3
  dart_test_tools: ^7.2.3
  ffigen: ^21.0.0
  freezed: ^4.0.0-dev.3
