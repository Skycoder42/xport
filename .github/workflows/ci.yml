name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  ci:
    name: CI
    uses: Skycoder42/dart_test_tools/.github/workflows/dart.yml@main
    with:
      buildRunner: true
      unitTestPaths: ""
      panaScoreThreshold: 30

  cd:
    name: CD
    needs:
      - ci
    uses: Skycoder42/dart_test_tools/.github/workflows/release.yml@main
    permissions:
      contents: write
      actions: write
    with:
      publishWorkflow: cd.yaml

  renovate:
    name: Renovate
    needs:
      - ci
      - cd
    if: ${{ !cancelled() }}
    uses: Skycoder42/dart_test_tools/.github/workflows/renovate-finish.yml@main
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      needs: ${{ toJSON(needs) }}
